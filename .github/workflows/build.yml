name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4

    - name: Build Droidian Kernel Package
      env:
        DEB_BUILD_OPTIONS: nocheck
        DH_VERBOSE: 1
      run: |
        # 1. Устанавливаем кросс-компилятор GCC и линкер для arm64
        sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu
        
        # 2. Создаем пути для компилятора
        sudo mkdir -p /usr/lib/llvm-android-10.0-r370808/bin
        sudo ln -sf $(which clang) /usr/lib/llvm-android-10.0-r370808/bin/clang
        sudo ln -sf $(which clang) /usr/bin/clang-10
        sudo ln -sf $(which aarch64-linux-gnu-gcc) /usr/lib/llvm-android-10.0-r370808/bin/clang-10
        
        # 3. Полностью отключаем все предупреждения (warnings) в Makefile
        if [ -f Makefile ]; then
          echo "Глушим все предупреждения (warnings) в Makefile..."
          sed -i 's/-Werror//g' Makefile
          sed -i 's/KBUILD_CFLAGS += -Werror//g' Makefile
          sed -i 's/KBUILD_CFLAGS   :=/KBUILD_CFLAGS   := -w /g' Makefile
        fi
        
        # 4. ФИКС ТРЕЙСИНГА UIFIRST (Более жесткий метод путей)
        if [ -f kernel/uifirst/uifirst_sched_trace.h ]; then
          echo "Фиксим пути для uifirst_sched_trace.h..."
          mkdir -p include/trace/events
          cp kernel/uifirst/uifirst_sched_trace.h include/trace/events/uifirst_sched_trace.h
          cp kernel/uifirst/uifirst_sched_trace.h include/uifirst_sched_trace.h
          # Перенаправляем макрос сборщика, если он путает пути
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../kernel/uifirst|g' kernel/uifirst/uifirst_sched_futex.c || true
        fi

        # 5. ФИКС ОШИБКИ ИНЛИНГА В oplus_wakelock_profiler_mtk.c
        if [ -f drivers/base/power/owakelock/oplus_wakelock_profiler_mtk.c ]; then
          echo "Убираем ломающий extern inline у ws_all_release..."
          sed -i 's/extern inline bool ws_all_release/bool ws_all_release/g' drivers/base/power/owakelock/oplus_wakelock_profiler_mtk.c
        fi

        # 6. Аккуратный фикс кривого флага декларации функций
        echo "Фиксим флаг декларации функций..."
        for file in Makefile arch/arm64/Makefile; do
          if [ -f "$file" ]; then
            sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' "$file"
          fi
        done

        # 7. ФИКС ПОТЕРЯННОГО ЗАСЛЕНЦА mtk-dsp-mem-control.h
        echo "Ищем и линкуем mtk-dsp-mem-control.h в глобальные инклуды..."
        DSP_H_PATH=$(find . -name "mtk-dsp-mem-control.h" -print -quit)
        if [ ! -z "$DSP_H_PATH" ]; then
          cp "$DSP_H_PATH" include/
        fi

        # 8. ФИКС ОШИБКИ INLINING FAILED ДЛЯ ksm_flock
        if [ -f include/linux/keyslot-manager.h ]; then
          echo "Убираем inline у функции ksm_flock..."
          sed -i 's/inline void ksm_flock/void ksm_flock/g' include/linux/keyslot-manager.h
        fi
        
        # 9. Вытаскиваем имя дефконфига
        KERNEL_DEFCONFIG=$(grep "KERNEL_DEFCONFIG" debian/kernel-info.mk | cut -d'=' -f2 | xargs || echo "oplus6781_defconfig")
        echo "Используем конфиг: $KERNEL_DEFCONFIG"
        
        # 10. Генерируем базовый .config
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- REAL_CC=clang $KERNEL_DEFCONFIG
        
        # 11. Отключаем STACKPROTECTOR и WERROR в сгенерированном .config
        if [ -f .config ]; then
          echo "Модифицируем .config..."
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/g' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/g' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_AUTO=y/# CONFIG_CC_STACKPROTECTOR_AUTO is not set/g' .config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> .config
        fi
        
        # 12. Компиляция ядра
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- REAL_CC=clang HOSTCFLAGS="-w" HOSTCXXFLAGS="-w" Image.gz-dtb
        
        # 13. Упаковка в .deb
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "Ядро успешно скомпилировано! Создаем структуру пакета..."
          mkdir -p deb-package/boot
          mkdir -p deb-package/DEBIAN
          cp arch/arm64/boot/Image.gz-dtb deb-package/boot/vmlinuz-oplus6781
          
          cat << 'EOF' > deb-package/DEBIAN/control
          Package: linux-image-droidian-oplus6781
          Version: 4.14.186-custom
          Architecture: arm64
          Maintainer: romka <nogioget@example.com>
          Description: Compiled Droidian Kernel for Realme 8i (oplus6781)
          EOF
          
          dpkg-deb --build deb-package ../linux-image-droidian-oplus6781.deb
        else
          echo "Ошибка: Файл ядра Image.gz-dtb не найден!"
          exit 1
        fi
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ../*.deb

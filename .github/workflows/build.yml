name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts equivs git \
          gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev libkmod-dev \
          kmod rsync u-boot-tools clang libncurses-dev

    - name: Build Droidian Kernel Package
      env:
        DEB_BUILD_OPTIONS: nocheck
        DH_VERBOSE: 1
      run: |
        # 1. Создаем пути для компилятора, которые прописаны в kernel-info.mk
        sudo mkdir -p /usr/lib/llvm-android-10.0-r370808/bin
        sudo ln -sf $(which clang) /usr/lib/llvm-android-10.0-r370808/bin/clang
        sudo ln -sf $(which clang) /usr/bin/clang-10
        sudo ln -sf $(which aarch64-linux-gnu-gcc) /usr/lib/llvm-android-10.0-r370808/bin/clang-10
        
        # 2. Вытаскиваем дефолтный конфиг из твоего kernel-info.mk (например, oplus6781_defconfig)
        # И перезаписываем debian/rules на чистый Makefile сборки ядра
        KERNEL_DEFCONFIG=$(grep "KERNEL_DEFCONFIG" debian/kernel-info.mk | cut -d'=' -f2 | xargs || echo "oplus6781_defconfig")
        
        cat << 'EOF' > debian/rules
        #!/usr/bin/make -f
        
        %:
        	dh $@
        
        override_dh_auto_configure:
        	make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- REAL_CC=clang $(KERNEL_DEFCONFIG)
        
        override_dh_auto_build:
        	make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- REAL_CC=clang Image.gz-dtb modules
        
        override_dh_auto_install:
        	mkdir -p debian/linux-image-droidian-arm64/boot
        	cp arch/arm64/boot/Image.gz-dtb debian/linux-image-droidian-arm64/boot/vmlinuz-droidian
        EOF
        
        chmod +x debian/rules
        
        # 3. Запускаем сборку!
        dpkg-buildpackage -b -d -uc -us
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ../*.deb

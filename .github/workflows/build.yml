name: Сборка ядра Droidian для Realme 8i

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Скачивание исходного кода ядра
      uses: actions/checkout@v4

    - name: Установка окружения и зависимостей компиляции
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses-dev bison flex libssl-dev libelf-dev xz-utils git make ccache clang lld llvm libgmp-dev libmpfr-dev libmpc-dev aarch64-linux-gnu-gcc dpkg-dev

    - name: Патчинг исходников и компиляция ядра
      run: |
        echo "Глушим все предупреждения (warnings) в Makefile..."
        if [ -f Makefile ]; then
          sed -i 's/-Wall/-w/g' Makefile
          sed -i 's/-Wformat/-w/g' Makefile
        fi

        echo "Добавляем скрытые папки MediaTek и Oppo в глобальный поиск инклудов..."
        LINUX_MAKEFILE="Makefile"
        if [ -f "$LINUX_MAKEFILE" ]; then
          sed -i '/NOSTDINC_FLAGS/d' $LINUX_MAKEFILE
          echo 'NOSTDINC_FLAGS := -I$(srctree)/include -I$(srctree)/arch/arm64/include -I$(srctree)/drivers/misc/mediatek/include -I$(srctree)/drivers/misc/mediatek/include/mt-plat -I$(srctree)/drivers/misc/mediatek/include/mt-plat/mt6781 -I$(srctree)/vendor/oplus/kernel/system/include' >> $LINUX_MAKEFILE
        fi

        echo "Фиксим пути для uifirst_sched_trace.h..."
        UIFIRST_H=$(find . -name "uifirst_sched_trace.h" -print -quit)
        if [ ! -z "$UIFIRST_H" ]; then
          mkdir -p include/trace/events
          cp "$UIFIRST_H" include/trace/events/
        fi

        echo "Убираем ломающий extern inline у ws_all_release..."
        WS_FILE=$(find . -name "oplus_local_modules.h" -print -quit || find . -name "oplus_ws.h" -print -quit)
        if [ ! -z "$WS_FILE" ] && [ -f "$WS_FILE" ]; then
          sed -i 's/extern inline void ws_all_release/void ws_all_release/g' "$WS_FILE"
        fi

        echo "Фиксим флаг декларации функций..."
        for f in $(find . -name "Makefile" -o -name "Kbuild"); do
          if grep -q "Werror" "$f"; then
            sed -i 's/-Werror//g' "$f"
          fi
        done

        echo "Копируем mtk_layer_layout_trace.h в глобальный трейсинг..."
        LAYER_H=$(find . -name "mtk_layer_layout_trace.h" -print -quit)
        if [ ! -z "$LAYER_H" ]; then
          mkdir -p include/trace/events
          cp "$LAYER_H" include/trace/events/
        fi

        echo "Ищем и линкуем разбросанные заголовки IOMMU и Touchscreen..."
        MTK_IOMMU_H=$(find . -name "mtk_iommu.h" -print -quit)
        if [ ! -z "$MTK_IOMMU_H" ]; then
          cp "$MTK_IOMMU_H" include/linux/
        fi
        GTP_H=$(find . -name "gt1x.h" -print -quit)
        if [ ! -z "$GTP_H" ]; then
          cp "$GTP_H" include/linux/
        fi

        echo "Собираем заголовочники из подсистем ADSP и MMC..."
        find drivers/misc/mediatek/vcodec/ -name "*.h" -exec cp {} include/linux/ \; 2>/dev/null || true
        find drivers/mmc/host/mediatek/ -name "*.h" -exec cp {} include/linux/ \; 2>/dev/null || true

        echo "Собираем заголовочники из подсистемы Audio IPI..."
        AUDIO_IPI_H=$(find . -name "audio_ipi.h" -print -quit)
        if [ ! -z "$AUDIO_IPI_H" ]; then
          cp "$AUDIO_IPI_H" include/linux/
        fi

        MSDC_CUST_FILE="drivers/mmc/host/mediatek/ComboA/mt6781/msdc_cust.c"
        if [ -f "$MSDC_CUST_FILE" ]; then
          echo "Применяем умную очистку тел функций в msdc_cust.c..."
          sed -i '/void msdc_dump_ldo_sts/,/^}/c\void msdc_dump_ldo_sts(char **buff, unsigned long *size, struct seq_file *m, struct msdc_host *host) { return; }' $MSDC_CUST_FILE
          sed -i '/void msdc_set_pin_mode/,/^}/c\void msdc_set_pin_mode(struct msdc_host *host) { return; }' $MSDC_CUST_FILE
          sed -i '/void msdc_set_ies_by_id/,/^}/c\void msdc_set_ies_

name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts equivs git \
          gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev libkmod-dev \
          kmod rsync u-boot-tools clang libncurses-dev

    Да, конечно! Вместо того чтобы вылавливать каждый варнинг поодиночке, можно сделать гораздо проще и правильнее: запретить компилятору превращать предупреждения (warnings) в критические ошибки (errors).

В ядре Linux за это отвечает флаг -Werror в главном Makefile. Если мы его уберем, то компилятор будет просто сыпать варнингами в лог (как ты и хочешь), но сборку останавливать не станет. Она упадет только в том случае, если случится настоящая фатальная ошибка кода (например, синтаксический слом, пропущенная скобка или реальный баг).

🛠 Как это сделать в build.yml
Замени свой шаг сборки на этот вариант. Здесь мы с помощью sed находим строки CONFIG_WERROR и флаги -Werror в Makefile и отключаем их:

YAML
    - name: Build Droidian Kernel Package
      env:
        DEB_BUILD_OPTIONS: nocheck
        DH_VERBOSE: 1
      run: |
        # 1. Создаем пути для компилятора
        sudo mkdir -p /usr/lib/llvm-android-10.0-r370808/bin
        sudo ln -sf $(which clang) /usr/lib/llvm-android-10.0-r370808/bin/clang
        sudo ln -sf $(which clang) /usr/bin/clang-10
        sudo ln -sf $(which aarch64-linux-gnu-gcc) /usr/lib/llvm-android-10.0-r370808/bin/clang-10
        
        # 2. ОТКЛЮЧАЕМ РЕЖИМ "WARNING AS ERROR" (Werror) в Makefile
        if [ -f Makefile ]; then
          echo "Отключаем жесткий режим Werror..."
          # Вырезаем флаг -Werror, чтобы предупреждения не стопили сборку
          sed -i 's/-Werror//g' Makefile
          sed -i 's/KBUILD_CFLAGS += -Werror//g' Makefile
        fi
        
        # 3. Вытаскиваем имя дефконфига
        KERNEL_DEFCONFIG=$(grep "KERNEL_DEFCONFIG" debian/kernel-info.mk | cut -d'=' -f2 | xargs || echo "oplus6781_defconfig")
        echo "Используем конфиг: $KERNEL_DEFCONFIG"
        
        # 4. Генерируем .config и на всякий случай отключаем WERROR там
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- REAL_CC=clang $KERNEL_DEFCONFIG
        if [ -f .config ]; then
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/g' .config
        fi
        
        # 5. Компиляция ядра (теперь варнинги будут просто предупреждениями)
        make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- REAL_CC=clang Image.gz-dtb
        
        # 6. Упаковка в .deb
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "Ядро успешно скомпилировано! Создаем структуру пакета..."
          mkdir -p deb-package/boot
          mkdir -p deb-package/DEBIAN
          cp arch/arm64/boot/Image.gz-dtb deb-package/boot/vmlinuz-oplus6781
          
          cat << 'EOF' > deb-package/DEBIAN/control
          Package: linux-image-droidian-oplus6781
          Version: 4.14.186-custom
          Architecture: arm64
          Maintainer: romka <nogioget@example.com>
          Description: Compiled Droidian Kernel for Realme 8i (oplus6781)
          EOF
          
          dpkg-deb --build deb-package ../linux-image-droidian-oplus6781.deb
        else
          echo "Ошибка: Файл ядра Image.gz-dtb не найден!"
          exit 1
        fi
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ../*.deb

name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts equivs git \
          gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev libkmod-dev \
          kmod rsync u-boot-tools clang
          
        # Скачиваем те самые общие шаблоны (snippets), без которых дебиановский rules отказывается работать
        sudo git clone https://github.com/droidian-releng/linux-packaging-snippets /usr/share/linux-packaging-snippets

    - name: Build Droidian Kernel Package
      env:
        DEB_BUILD_OPTIONS: nocheck
        DH_VERBOSE: 1
      run: |
        # 1. Создаем структуру папок, которую требует твой kernel-info.mk
        sudo mkdir -p /usr/lib/llvm-android-10.0-r370808/bin
        
        # 2. Подсовываем системный clang и инструменты туда, где их ждет мейкфайл ядра
        sudo ln -sf $(which clang) /usr/lib/llvm-android-10.0-r370808/bin/clang
        sudo ln -sf $(which clang) /usr/bin/clang-10
        sudo ln -sf $(which aarch64-linux-gnu-gcc) /usr/lib/llvm-android-10.0-r370808/bin/clang-10
        
        # 3. Запускаем сборку. Теперь rules найдет свой kernel-snippet.mk!
        dpkg-buildpackage -b -d -uc -us

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ../*.deb

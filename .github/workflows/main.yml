name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts equivs git \
          gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev libkmod-dev \
          kmod rsync u-boot-tools clang

    - name: Build Droidian Kernel Package
      env:
        DEB_BUILD_OPTIONS: nocheck
        DH_VERBOSE: 1
      run: |
        # 1. Обманываем сборщик версией Clang
        sudo ln -s $(which clang) /usr/bin/clang-10
        
        # 2. Принудительно подключаем наш kernel-info.mk в переменные окружения,
        # чтобы компилятор сразу узнал все настройки ядра и архитектуру
        if [ -f debian/kernel-info.mk ]; then
          echo "Подключаем настройки из kernel-info.mk..."
          export $(grep -v '^#' debian/kernel-info.mk | xargs)
        fi
        
        # 3. Запускаем прямую сборку пакета.
        # -b (только бинарники), -d (пропустить проверку зависимостей, мы их уже поставили)
        dpkg-buildpackage -b -d -uc -us
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ./*.deb

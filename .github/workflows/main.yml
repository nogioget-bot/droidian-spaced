name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts equivs git \
          gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev libkmod-dev \
          kmod rsync u-boot-tools clang

    - name: Build Droidian Kernel Package
      env:
        RELENG_HOST_ARCH: arm64
      run: |
        # Клонируем инструменты сборки
        git clone https://github.com/droidian-releng/droidian-build-tools /tmp/releng-tools
        
        # Обманываем сборщик версией Clang
        sudo ln -s $(which clang) /usr/bin/clang-10
        
        # Шаг А: Генерируем пакет зависимостей сборки под наше ядро oplus6781
        /tmp/releng-tools/bin/droidian-build-package -b arm64 --suppress-build || true
        
        # Шаг Б: Принудительно устанавливаем этот сгенерированный пакет зависимостей в систему
        sudo dpkg -i linux-android-oplus6781-build-deps_*.deb || sudo apt-get install -f -y
        
        # Шаг В: Запускаем финальную компиляцию через родной скрипт Droidian без лишних флагов
        /tmp/releng-tools/bin/droidian-build-package -b arm64
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ./*.deb

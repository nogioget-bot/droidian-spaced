name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts equivs git \
          gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev libkmod-dev \
          kmod rsync u-boot-tools clang

    - name: Build Droidian Kernel Package
      env:
        RELENG_HOST_ARCH: arm64
      run: |
        git clone https://github.com/droidian/releng-tools /tmp/releng-tools
        sudo ln -s /tmp/releng-tools/releng-build-package /usr/bin/releng-build-package
        sudo ln -s /tmp/releng-tools/releng-build-changelog /usr/bin/releng-build-changelog
        sudo ln -s $(which clang) /usr/bin/clang-10
        releng-build-package --no-build-deps

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ./*.deb

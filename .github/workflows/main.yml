name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts equivs git \
          gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev libkmod-dev \
          kmod rsync u-boot-tools clang

    - name: Build Droidian Kernel Package
      env:
        DEB_BUILD_OPTIONS: nocheck
        DH_VERBOSE: 1
      run: |
        # Смотрим, какие файлы вообще скачались и где мы находимся
        ls -la
        
        # Обманываем сборщик версией Clang
        sudo ln -s $(which clang) /usr/bin/clang-10
        
        # Запускаем классическую сборку Debian-пакета:
        # -b (только бинарники), -d (игнорировать зависимости), -uc -us (без подписи кода)
        dpkg-buildpackage -b -d -uc -us
        
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ./*.deb

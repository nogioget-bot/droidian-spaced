name: Build Droidian Kernel

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout kernel sources
      uses: actions/checkout@v4

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential debhelper devscripts equivs git \
          gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev libkmod-dev \
          kmod rsync u-boot-tools clang

    - name: Build Droidian Kernel Package
      env:
        RELENG_HOST_ARCH: arm64
      run: |
        # 1. Клонируем инструменты сборки
        git clone https://github.com/droidian-releng/droidian-build-tools /tmp/releng-tools
        
        # 2. Обманываем сборщик версией Clang
        sudo ln -s $(which clang) /usr/bin/clang-10
        
        # 3. Запускаем чистую сборку. Так как папка debian/ теперь на месте, 
        # скрипт сам подхватит и твой kernel-info.mk, и инфу об адаптации!
        /tmp/releng-tools/bin/droidian-build-package -b arm64

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Droidian-Kernel-Packages
        path: ./*.deb
